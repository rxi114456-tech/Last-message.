<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>For You</title>

<!-- หน้าปกเวลาส่งลิงก์ -->
<meta property="og:title" content="For You">
<meta property="og:description" content="last message: you'll like it">
<meta property="og:image" content="https://i.pinimg.com/736x/f1/a4/8b/f1a48b418fabe9d9aaa669dc03f497a2.jpg">
<meta property="og:type" content="website">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =========================
   BACKGROUND
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;

  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(255,180,205,.5), transparent 30%),
    linear-gradient(135deg, #ffe6f0, #ffffff, #ffd6e7);

  background-size: 200% 200%;
  animation: backgroundMove 12s ease infinite;

  padding: 35px 15px;
  overflow-x: hidden;
}

@keyframes backgroundMove {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}


/* =========================
   BOX
========================= */

.box {
  width: min(420px, 94vw);
  margin: 30px auto;

  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);

  padding: 28px;
  border-radius: 25px;

  box-shadow:
    0 15px 50px rgba(255,77,109,.18),
    0 0 30px rgba(255,255,255,.8);

  animation: boxAppear 1s ease;
}

@keyframes boxAppear {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.95);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}


/* =========================
   TEXT
========================= */

h1 {
  color: #ff4d6d;
}

h2 {
  color: #444;
}

p {
  color: #555;
  line-height: 1.8;
}


/* =========================
   INPUT
========================= */

input {
  width: 85%;
  padding: 13px;

  border: 1px solid #ddd;
  border-radius: 12px;

  outline: none;
  text-align: center;
  font-size: 16px;

  transition: .3s;
}

input:focus {
  border-color: #ff4d6d;
  box-shadow: 0 0 15px rgba(255,77,109,.2);
}


/* =========================
   BUTTON
========================= */

button {
  border: none;
  border-radius: 12px;

  padding: 12px 24px;
  margin: 6px;

  background: linear-gradient(135deg,#ff4d6d,#ff758f);

  color: white;
  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  box-shadow: 0 7px 20px rgba(255,77,109,.25);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

button:hover {
  transform: scale(1.06);

  box-shadow:
    0 10px 30px rgba(255,77,109,.35);
}


/* =========================
   IMAGE
========================= */

.mainImage {
  width: 210px;
  max-width: 80%;

  margin-top: 15px;

  border-radius: 20px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.15);

  transition: .5s;
}

.mainImage:hover {
  transform: scale(1.04) rotate(1deg);
}


/* =========================
   YES BUTTON
========================= */

#yesBtn {
  font-size: 16px;
  font-weight: bold;

  position: relative;
  z-index: 10;

  transition:
    all .5s cubic-bezier(.17,.67,.3,1.4);
}


/* =========================
   FINAL MESSAGE
========================= */

#finalMessage {
  display: none;

  position: relative;

  animation: finalAppear 1.5s ease;
}

@keyframes finalAppear {
  0% {
    opacity: 0;
    transform: scale(.8);
    filter: blur(10px);
  }

  100% {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }
}

#customText {
  text-align: left;

  white-space: pre-wrap;

  font-size: 16px;
  line-height: 2;

  color: #444;

  min-height: 100px;
}


/* =========================
   FINAL GLOW
========================= */

.finalGlow {
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from {
    box-shadow:
      0 0 20px rgba(255,77,109,.15);
  }

  to {
    box-shadow:
      0 0 50px rgba(255,77,109,.4);
  }
}


/* =========================
   HEARTS
========================= */

.heart {
  position: fixed;

  bottom: -40px;

  pointer-events: none;

  animation:
    heartFloat linear forwards;

  z-index: 100;
}

@keyframes heartFloat {

  0% {
    transform:
      translateY(0)
      rotate(0deg)
      scale(.6);

    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-110vh)
      rotate(360deg)
      scale(1.3);

    opacity: 0;
  }
}


/* =========================
   SPARKLES
========================= */

.sparkle {
  position: fixed;

  pointer-events: none;

  color: white;

  font-size: 18px;

  animation: sparkleMove 2s ease-out forwards;

  z-index: 90;
}

@keyframes sparkleMove {

  0% {
    opacity: 1;
    transform: scale(.2);
  }

  100% {
    opacity: 0;
    transform: scale(1.8) translateY(-80px);
  }
}


/* =========================
   SCREEN FLASH
========================= */

#flash {
  position: fixed;

  inset: 0;

  background: white;

  pointer-events: none;

  opacity: 0;

  z-index: 999;
}

.flashActive {
  animation: flashEffect .5s ease;
}

@keyframes flashEffect {

  0% {
    opacity: 0;
  }

  30% {
    opacity: .8;
  }

  100% {
    opacity: 0;
  }
}


/* =========================
   PLEASE FULL SCREEN
========================= */

#yesBtn.fullscreen {
  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  margin: 0;

  border-radius: 0;

  z-index: 1000;

  font-size: 45px !important;

  display: flex;
  align-items: center;
  justify-content: center;

  animation: pleasePulse 1s infinite alternate;
}

@keyframes pleasePulse {

  from {
    box-shadow:
      0 0 30px rgba(255,77,109,.4);
  }

  to {
    box-shadow:
      0 0 100px rgba(255,77,109,.8);
  }
}


/* =========================
   MUSIC
========================= */

#bgm {
  display: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  body {
    padding: 20px 10px;
  }

  .box {
    padding: 22px 17px;
  }

  #customText {
    font-size: 15px;
    line-height: 1.9;
  }

}

</style>
</head>


<body>

<!-- เอฟเฟกต์แสง -->
<div id="flash"></div>


<!-- =========================
     LOGIN
========================= -->

<div class="box" id="loginBox">

  <h2>your birthday</h2>

  <p>last message: you'll like it</p>

  <input
    type="password"
    id="pass"
    placeholder="dd/mm/yyyy"
  >

  <br><br>

  <button onclick="checkPass()">
    Enter
  </button>

</div>


<!-- =========================
     MAIN PAGE
========================= -->

<div
  class="box"
  id="content"
  style="display:none;"
>

  <h1>i miss you</h1>

  <p>can we talk again?</p>

  <img
    class="mainImage"
    src="https://i.pinimg.com/736x/f1/a4/8b/f1a48b418fabe9d9aaa669dc03f497a2.jpg"
  >

  <br><br>

  <button
    id="yesBtn"
    onclick="yesClick()"
  >
    yes
  </button>

  <button onclick="growYes()">
    no
  </button>

</div>


<!-- =========================
     FINAL MESSAGE
========================= -->

<div
  class="box"
  id="finalMessage"
>

  <h1>💌</h1>

  <p id="customText"></p>

  <!--
  🎵 ใส่เพลงของตัวเองตรง src ตรงนี้

  ตัวอย่าง:
  <source src="https://example.com/song.mp3">

  -->

  <audio
    id="bgm"
    loop
  >
    <source
      src="PUT-YOUR-MUSIC-LINK-HERE.mp3"
      type="audio/mpeg"
    >
  </audio>

</div>


<script>

/* =========================
   PASSWORD
========================= */

function checkPass() {

  let pass =
    document.getElementById("pass").value;

  if (pass === "17/01/2011") {

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("content")
      .style.display = "block";

    sparkleBurst();

  } else {

    alert("wrong password 😢");

  }

}


/* =========================
   NO → PLEASE
========================= */

let size = 16;
let noCount = 0;

function growYes() {

  let yes =
    document.getElementById("yesBtn");

  noCount++;

  /* เปลี่ยนข้อความตามจำนวนครั้ง */

  if (noCount === 1) {

    yes.innerText = "please";

  } else {

    yes.innerText = "PLEASE";

  }


  /* ทำให้ใหญ่ขึ้น */

  size += 12;

  yes.style.fontSize =
    size + "px";

  yes.style.padding =
    (size / 2) + "px " +
    size + "px";


  /* สั่นเบา ๆ */

  document.body.animate(
    [
      { transform: "translateX(0)" },
      { transform: "translateX(-5px)" },
      { transform: "translateX(5px)" },
      { transform: "translateX(0)" }
    ],
    {
      duration: 300
    }
  );


  /* แสงแฟลช */

  let flash =
    document.getElementById("flash");

  flash.classList.remove("flashActive");

  void flash.offsetWidth;

  flash.classList.add("flashActive");


  /* ดาว/ประกาย */

  sparkleBurst();


  /* เมื่อใหญ่พอ → เต็มจอ */

  if (size >= 100) {

    yes.classList.add("fullscreen");

  }

}


/* =========================
   YES
========================= */

function yesClick() {

  document.getElementById("content")
    .style.display = "none";

  let final =
    document.getElementById("finalMessage");

  final.style.display = "block";

  final.classList.add("finalGlow");


  /*
    ข้อความเดิม
  */

  let text =
  "i know i messed up everything but i still think about you every single day i miss the way we used to talk i miss your voice your replies your presence i’m not here to force anything i just want to say what i feel before it’s too late if you still remember me even a little can we start over slowly no pressure no expectations just a chance to talk again i really do miss you";


  let output =
    document.getElementById("customText");

  output.innerHTML = "";

  let i = 0;


  /* typing effect */

  function typing() {

    if (i < text.length) {

      output.innerHTML +=
        text[i];

      i++;

      setTimeout(
        typing,
        28
      );

    }

  }

  typing();


  /* เอฟเฟกต์ */

  createHearts();

  sparkleBurst();

  createSparkles();


  /* เพลง */

  let music =
    document.getElementById("bgm");

  music.play().catch(() => {
    console.log(
      "Music needs user interaction."
    );
  });

}


/* =========================
   HEART EFFECT
========================= */

let heartStarted = false;

function createHearts() {

  if (heartStarted) return;

  heartStarted = true;

  setInterval(() => {

    let heart =
      document.createElement("div");

    heart.className =
      "heart";

    heart.innerHTML =
      ["💖","💗","💕","💞","❤️"][
        Math.floor(
          Math.random() * 5
        )
      ];


    heart.style.left =
      Math.random() * 100 + "vw";


    heart.style.fontSize =
      (12 + Math.random() * 22)
      + "px";


    heart.style.animationDuration =
      (3 + Math.random() * 4)
      + "s";


    document.body.appendChild(
      heart
    );


    setTimeout(() => {

      heart.remove();

    }, 7000);

  }, 350);

}


/* =========================
   SPARKLES
========================= */

function createSparkles() {

  setInterval(() => {

    let sparkle =
      document.createElement("div");

    sparkle.className =
      "sparkle";

    sparkle.innerHTML =
      "✦";


    sparkle.style.left =
      Math.random() * 100 + "vw";

    sparkle.style.top =
      Math.random() * 100 + "vh";


    document.body.appendChild(
      sparkle
    );


    setTimeout(() => {

      sparkle.remove();

    }, 2000);

  }, 500);

}


/* =========================
   SPARKLE BURST
========================= */

function sparkleBurst() {

  for (
    let i = 0;
    i < 18;
    i++
  ) {

    let sparkle =
      document.createElement("div");

    sparkle.className =
      "sparkle";

    sparkle.innerHTML =
      ["✦","♡","✧","⋆"][
        Math.floor(
          Math.random() * 4
        )
      ];


    sparkle.style.left =
      (45 + Math.random() * 10)
      + "vw";

    sparkle.style.top =
      (40 + Math.random() * 20)
      + "vh";


    document.body.appendChild(
      sparkle
    );


    setTimeout(() => {

      sparkle.remove();

    }, 2000);

  }

}

</script>

</body>
  </html>
